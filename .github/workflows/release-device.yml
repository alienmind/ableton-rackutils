# Publishes the companion .amxd as a release asset.
# The site's download button reads the latest release via the GitHub API,
# so shipping a device update does not require redeploying the site.
name: Release companion device

on:
  push:
    tags: ['device-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Verified pure Node: `pnpm --filter @rackutils/m4l-device build` runs
    # (esbuild + the m4l-jweb CLI) with no Max install and no macOS-specific
    # step. No need for the ~10x cost of a macOS runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @rackutils/adg-codec test

      # NOT YET: bundling apps/site's UI into the device (doc/PLAN.md Phase
      # 5.5) is unimplemented. packages/m4l-device builds its OWN placeholder
      # UI (src/app/rack-editor/App.tsx) via its own vite config, entirely
      # separate from apps/site right now. When 5.5 lands, this step gains a
      # "build site with VITE_BASE=./" step feeding the device build, plus the
      # absolute-asset-path guard the plan describes - the single most likely
      # device-side failure once embedding exists.
      - name: Build device
        run: pnpm --filter @rackutils/m4l-device build

      - uses: softprops/action-gh-release@v2
        with:
          files: packages/m4l-device/dist/@rackutils/m4l-device/*.amxd
          generate_release_notes: true
