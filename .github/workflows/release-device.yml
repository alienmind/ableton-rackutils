# Publishes the companion device - the `.amxd` plus the web app that travels
# beside it - as release assets.
#
# Two releases, on purpose (doc/PLAN.md 4.7, D5):
#
# - every push to `main` overwrites the rolling `latest-device` prerelease, so
#   a nightly is always available;
# - a `vX.Y.Z` tag publishes the same build against that version, and THAT is
#   what the site's download card offers. A user reporting a bug can say which
#   device they have, and the device and the site that documents it move
#   together instead of the device changing under a fixed link.
name: Release companion device

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Verified pure Node: `pnpm --filter @rackutils/m4l-device build` runs
    # (esbuild + the m4l-jweb CLI) with no Max install and no macOS-specific
    # step. No need for the ~10x cost of a macOS runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @rackutils/adg-codec test

      # Builds apps/site with VITE_BASE=./ and VITE_EMBED=1, copies it into the
      # device, then packages the .amxd, its `-site` folder and the installers
      # into one zip.
      - name: Build device
        run: pnpm --filter @rackutils/m4l-device build

      # The two device-side failure modes, checked on the bytes that ship
      # rather than on the ones that were built (scripts/check-site-bundle.mjs
      # says why each one is fatal). An absolute asset path resolves against
      # the filesystem root inside jweb and 404s into a blank window; a service
      # worker can serve a stale UI after a device update.
      - name: Guard the embedded site
        run: |
          node apps/m4l-device/scripts/check-site-bundle.mjs \
            apps/m4l-device/dist/@rackutils/m4l-device/rack-editor-site/editor

      - name: Rolling build
        if: startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-device
          name: 'Companion device (latest build)'
          body: |
            Auto-built from `main` at ${{ github.sha }}. Not a versioned
            release - this tag is overwritten on every push, and the site's
            download card points at the newest `vX.Y.Z` instead.

            Download the zip: the `.amxd` needs the `rack-editor-site` folder
            beside it. On macOS, remove the quarantine flag before installing.
          prerelease: true
          files: |
            apps/m4l-device/dist/@rackutils/m4l-device.zip
            apps/m4l-device/dist/@rackutils/m4l-device/*.amxd

      - name: Versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            The companion device for ${{ github.ref_name }}: the editor,
            bundled, so it runs inside Live with no browser and no network.

            Download the zip and unpack it whole - the `.amxd` reads the
            `rack-editor-site` folder next to it, and opens an empty window
            without it. `install-mac.sh` and `install-windows.ps1` copy both
            into the User Library. On macOS the download carries a quarantine
            flag; the installer clears it, or run
            `xattr -dr com.apple.quarantine` on the unpacked folder yourself.
          files: |
            apps/m4l-device/dist/@rackutils/m4l-device.zip
            apps/m4l-device/dist/@rackutils/m4l-device/*.amxd
