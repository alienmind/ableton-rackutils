# Publishes the companion .amxd as a release asset, automatically, on every
# push to main - not gated behind a manual tag. It always updates the SAME
# rolling release (tag `latest-device`), since there's no real versioning
# scheme yet (the whole project is v0.0.1 pre-alpha). The site's download
# button reads this exact tag via the GitHub API, so shipping a device update
# does not require redeploying the site.
name: Release companion device

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Verified pure Node: `pnpm --filter @rackutils/m4l-device build` runs
    # (esbuild + the m4l-jweb CLI) with no Max install and no macOS-specific
    # step. No need for the ~10x cost of a macOS runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @rackutils/adg-codec test

      # NOT YET: bundling apps/site's UI into the device (doc/PLAN.md Phase
      # 5.5) is unimplemented. apps/m4l-device builds its OWN placeholder
      # UI (src/app/rack-editor/App.tsx) via its own vite config, entirely
      # separate from apps/site right now. When 5.5 lands, this step gains a
      # "build site with VITE_BASE=./" step feeding the device build, plus the
      # absolute-asset-path guard the plan describes - the single most likely
      # device-side failure once embedding exists.
      - name: Build device
        run: pnpm --filter @rackutils/m4l-device build

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-device
          name: 'Companion device (latest build)'
          body: |
            Auto-built from `main` at ${{ github.sha }}. Not a versioned
            release - this tag is overwritten on every push. Scaffold status:
            see doc/PLAN.md Phase 5. Install via the site's download button,
            or drag `rack-editor.amxd` onto a track in Live 12.
          prerelease: true
          files: apps/m4l-device/dist/@rackutils/m4l-device/*.amxd
