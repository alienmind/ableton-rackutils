# Adapted from alienmind/trackster's deploy.yml. Kept: the VITE_BASE +
# repository.name pattern, pnpm/action-setup@v4, node 22. Added: the codec test
# gate, and a filtered build since this is a workspace with multiple apps.
#
# Publishes to the `gh-pages` BRANCH rather than uploading a Pages artifact.
# An artifact replaces the whole site on every deploy, which is fine for one
# site and impossible for a site plus the beta previews that live under
# /preview/ (see beta.yml). Publishing to a branch with `keep_files` lets the
# two coexist: main owns the root, a beta owns its own folder, and neither
# deletes the other.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Shared with beta.yml: both push to `gh-pages`, and two at once means one is
# rejected mid-run.
concurrency:
  group: 'gh-pages'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # Codec tests gate the deploy. A broken codec silently corrupts racks,
      # which is worse than being down.
      - run: pnpm --filter @rackutils/adg-codec test

      - name: Build site
        run: pnpm --filter @rackutils/site build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Publish
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/site/dist
          # Previews under /preview/ are not this build's to delete. The cost
          # is that a file main stops shipping lingers; Vite hashes its assets,
          # so what lingers is unreferenced rather than stale.
          keep_files: true
          commit_message: 'site from ${{ github.sha }}'
